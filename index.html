<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' blob:; worker-src 'self' blob:; object-src 'none';">
  <title>共有用_サボる時計 v0.2.1</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%0A%3Crect%20x%3D%272%27%20y%3D%272%27%20width%3D%2728%27%20height%3D%2728%27%20rx%3D%276%27%20fill%3D%27black%27%20stroke%3D%27white%27%20stroke-width%3D%272%27%2F%3E%0A%3Cpath%20d%3D%27M6%2016%20h20%20M16%206%20v20%27%20stroke%3D%27white%27%20stroke-width%3D%272%27%20stroke-linecap%3D%27round%27%2F%3E%0A%3C%2Fsvg%3E">

<style>
  html, body { height:100%; margin:0; background:#000; color:#eee; }
  html, body { width:100%; overflow:hidden; overscroll-behavior:none; }
  #canvas-holder { position:fixed; inset:0; background:#000; overflow:hidden; width:100vw; height:100dvh; touch-action:none; }
  @supports (height: 100dvh){ #canvas-holder { height:100dvh; } }

  /* --- Local Inter fonts (offline) --- */
  @font-face {
    font-family: 'InterLocal';
    src: url('./fonts/Inter-Regular.otf') format('opentype');
    font-style: normal;
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'InterLocal';
    src: url('./fonts/Inter-Bold.otf') format('opentype');
    font-style: normal;
    font-weight: 700;
    font-display: swap;
  }
  #font-warmup {
    position: fixed;
    left: -9999px;
    top: -9999px;
    font-family: 'InterLocal', sans-serif;
    font-weight: 700;
    font-size: 32px;
    line-height: 1;
    opacity: 0;
    pointer-events: none;
  }

  /* --- UI --- */
    :root{
    --ui-bg: rgba(20,20,20,0.86);
    --ui-bd: rgba(255,255,255,0.20);
    --ui-tx: #f2f2f2;
    --ui-sub: rgba(255,255,255,0.75);
    --btn-bg: rgba(255,255,255,0.10);
    --btn-bg-h: rgba(255,255,255,0.14);
    --btn-bd: rgba(255,255,255,0.22);
    --btn-bd-h: rgba(255,255,255,0.28);
    --btn-primary-bg: rgba(56,128,255,0.28);
    --btn-primary-bd: rgba(56,128,255,0.48);

    /* responsive sizing tokens */
    --ui-font: clamp(11px, 1.55vmin, 15px);
    --ui-font-lg: clamp(12px, 1.9vmin, 16px);
    --ui-line: 1.35;
    --ui-pad: clamp(10px, 1.8vmin, 14px);
    --ui-gap: clamp(8px, 1.5vmin, 12px);
    --ui-radius: clamp(12px, 2.0vmin, 16px);
    --ui-panel-w: clamp(230px, 34vw, 340px);
    --ui-icon: clamp(34px, 5.6vmin, 44px);
    --ui-btn-pad-y: clamp(10px, 1.6vmin, 12px);
    --ui-btn-pad-x: clamp(10px, 1.8vmin, 14px);
    --ui-shadow: 0 10px 30px rgba(0,0,0,0.45);
  }

  #ui {
    position:fixed;
    left: calc(12px + env(safe-area-inset-left));
    top:  calc(12px + env(safe-area-inset-top));
    z-index:99999;
    background:var(--ui-bg);
    color:var(--ui-tx);
    border:1px solid var(--ui-bd);
    border-radius:var(--ui-radius);
    padding:var(--ui-pad);
    backdrop-filter: blur(6px);
    box-shadow: var(--ui-shadow);
    font: var(--ui-font)/var(--ui-line) system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    width: min(calc(100vw - 24px - env(safe-area-inset-left) - env(safe-area-inset-right)), var(--ui-panel-w));
    max-width: min(calc(100vw - 24px - env(safe-area-inset-left) - env(safe-area-inset-right)), var(--ui-panel-w));
  }

  #uiHeader{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:var(--ui-gap);
    margin-bottom:var(--ui-gap);
  }

  .ui-btn, .ui-icon-btn{
    -webkit-appearance:none;
    appearance:none;
    border:1px solid var(--btn-bd);
    background:var(--btn-bg);
    color:#fff;
    border-radius: calc(var(--ui-radius) - 2px);
    padding: var(--ui-btn-pad-y) var(--ui-btn-pad-x);
    font: var(--ui-font)/1 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    cursor:pointer;
    user-select:none;
    box-shadow: 0 6px 18px rgba(0,0,0,0.28);
    touch-action: manipulation;
  }
  .ui-btn:hover, .ui-icon-btn:hover{ background:var(--btn-bg-h); border-color:var(--btn-bd-h); }
  .ui-btn:active, .ui-icon-btn:active{ transform: translateY(1px); }
  .ui-btn.primary{ background:var(--btn-primary-bg); border-color:var(--btn-primary-bd); }
  .ui-btn.primary:hover{ background:rgba(56,128,255,0.34); border-color:rgba(56,128,255,0.60); }

  #uiActions{ display:flex; flex-direction:column; gap:var(--ui-gap); }

  #btnHideUI{
    width:var(--ui-icon);
    height:var(--ui-icon);
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: clamp(16px, 2.6vmin, 20px);
  }

  /* Settings FAB (shown when UI collapsed) */
  #uiFab{
    position:fixed;
    right: calc(12px + env(safe-area-inset-right));
    top:   calc(12px + env(safe-area-inset-top));
    z-index:99998;
    width:var(--ui-icon);
    height:var(--ui-icon);
    padding:0;
    display:none;
    align-items:center;
    justify-content:center;
    font-size: clamp(16px, 2.6vmin, 20px);
    border-radius:var(--ui-radius);
  }

  /* --- Fullscreen help overlay --- */
  #fsHelp{
    position:fixed;
    inset:0;
    z-index:99997;
    background:rgba(0,0,0,0.82);
    color:#fff;
    display:none;
    padding: clamp(14px, 2.8vmin, 24px) clamp(12px, 2.2vmin, 18px);
    font: var(--ui-font-lg)/1.55 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
  }
  #fsHelp .panel{
    position:relative;
    max-width:min(92vw, 720px);
    margin:0 auto;
    background:rgba(20,20,20,0.86);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:var(--ui-radius);
    padding:var(--ui-pad);
    box-shadow:var(--ui-shadow);
  }
  #fsHelp .panel h2{ margin:0 0 8px 0; font-size: clamp(15px, 2.2vmin, 19px); }
  #fsHelp .panel ol{ margin:8px 0 0 20px; }
  #fsHelp .panel .small{ font-size: clamp(11px, 1.6vmin, 13px); opacity:0.9; }
  #fsHelpClose{ margin-top: var(--ui-gap); }

  #fsHelpX{
    position:absolute;
    right: calc(var(--ui-gap) * 0.6);
    top:   calc(var(--ui-gap) * 0.6);
    width: var(--ui-icon);
    height: var(--ui-icon);
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: clamp(18px, 3.0vmin, 22px);
    border-radius: calc(var(--ui-radius) - 2px);
  }

  /* --- Camera preview (optional) --- */
  #camWrap{
    position:fixed;
    right: calc(10px + env(safe-area-inset-right));
    bottom: calc(10px + env(safe-area-inset-bottom));
    width: clamp(140px, 26vw, 300px);
    z-index:99996;
    background:rgba(0,0,0,0.40);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:var(--ui-radius);
    padding: clamp(5px, 1.0vmin, 8px);
    display:none;
  }
  #camInner{ position:relative; width:100%; }
  #cam{
    width:100%;
    height:auto;
    max-height: 28vh;
    object-fit: cover;
    display:block;
    transform:scaleX(-1);
    border-radius: calc(var(--ui-radius) - 4px);
  }
  #faceBox{
    position:absolute;
    left:0; top:0;
    width:0; height:0;
    border: clamp(1px, 0.35vmin, 2px) solid rgba(0,255,0,0.9);
    border-radius: clamp(4px, 0.9vmin, 8px);
    box-sizing:border-box;
    pointer-events:none;
    display:none;
  }
</style>
</head>

<body>
  <span id="font-warmup">0123456789:</span>

  <div id="ui" role="dialog" aria-label="設定">
    <div id="uiHeader">
      <button id="btnHideUI" class="ui-icon-btn" aria-label="閉じる">→</button>
    </div>

    <div id="uiActions">
      <button id="btnFS" class="ui-btn">⛶ フルスクリーン</button>
      <button id="btnCam" class="ui-btn primary">📷 カメラを許可して開始</button>
      <button id="btnPreview" class="ui-btn">カメラプレビューを表示</button>
    </div>
  </div>

  <button id="uiFab" class="ui-icon-btn" aria-label="設定">⚙</button>

  <div id="fsHelp">
    <div class="panel">
      <button id="fsHelpX" class="ui-icon-btn" aria-label="閉じる">×</button>
      <h2>フルスクリーンにする</h2>
      <p>ブラウザによってはページからフルスクリーンができない場合があります。<br>
      その場合は、端末の機能（ホーム画面に追加 など）で全画面表示にしてください。</p>
      <ol>
        <li>共有ボタン（□↑）を押す</li>
        <li><b>「ホーム画面に追加」</b> を選ぶ</li>
        <li>追加したアイコンから起動する</li>
      </ol>
      <p class="small">※カメラは HTTPS またはローカルサーバ（localhost）で開いてください。</p>
      <button id="fsHelpClose" class="ui-btn">閉じる</button>
    </div>
  </div>

  <!-- Camera preview (optional) -->
  <div id="camWrap">
    <div id="camInner">
      <video id="cam" autoplay playsinline muted></video>
      <div id="faceBox"></div>
    </div>
  </div>

  <div id="canvas-holder"></div>

  <!-- p5 (bundled for offline use) -->
  <script src="./libs/p5.min.js"></script>
  <script src="./src/main.js" defer></script>
</body>
</html>
